services:
  - type: web
    name: lunar-horizon-api
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt && python data_pipeline/fetch_deployment_assets.py && python ml/train_model.py
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        sync: false
